name: Phase 0 validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and docs validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.18,<5"

      - name: Validate contract schemas and examples
        run: python scripts/validate-contracts.py --require-jsonschema --check-formats --warnings-as-errors

      - name: Check local Markdown links
        run: python scripts/check-doc-links.py

      - name: Check whitespace errors
        run: git diff --check
