name: Phase validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and docs validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate contract schemas and examples
        run: python scripts/validate-contracts.py --require-jsonschema --check-formats --warnings-as-errors

      - name: Check reason-code conformance
        run: python scripts/check-reason-codes.py

      - name: Check local Markdown links
        run: python scripts/check-doc-links.py

      - name: Run Phase 1A runtime tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall lima_office scripts tests

      - name: Check whitespace errors
        run: git diff --check

  exact-governed-arc-stack:
    name: Exact governed Arc stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out LIMA Office
        uses: actions/checkout@v4

      - name: Check out exact Arc consumer
        uses: actions/checkout@v4
        with:
          repository: armpit-symphony/Arc-Bot-shell
          ref: 650df26c9f5696432e30d5d1ac44806be843c803
          path: arc-bot-shell

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact governed stack
        run: python -m pip install -r requirements-lab.txt

      - name: Verify exact package identities
        run: python scripts/check-exact-governed-stack-pins.py

      - name: Run complete exact-stack tests
        run: python -m unittest discover -s tests -v

      - name: Prove foreground Arc worker control plane
        run: |
          python scripts/arc-worker-control-plane-smoke.py \
            --arc-source "$GITHUB_WORKSPACE/arc-bot-shell"

      - name: Prove real Arc operator to Supervisor flow
        run: |
          python scripts/arc-operator-supervisor-smoke.py \
            --arc-source "$GITHUB_WORKSPACE/arc-bot-shell"

      - name: Prove the execution grant path and every opt-in gate
        run: >-
          python scripts/arc-execution-grant-smoke.py
          --arc-source "$GITHUB_WORKSPACE/arc-bot-shell"

      - name: Prove one, two, and eight foreground Arc workers
        shell: bash
        run: |
          for worker_count in 1 2 8; do
            python scripts/arc-multi-worker-supervisor-smoke.py \
              --arc-source "$GITHUB_WORKSPACE/arc-bot-shell" \
              --worker-count "$worker_count"
          done
